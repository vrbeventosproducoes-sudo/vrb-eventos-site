<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | VRB Eventos & Produções</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --black:#111111; --gold:#C8A24A; --white:#FFFFFF; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: var(--black); color: var(--white);
    font-family:'Montserrat', sans-serif; text-align:center; padding: 32px;
  }
  .wrap{ max-width: 560px; }
  .code{
    font-family:'Playfair Display', serif; font-style:italic; color: var(--gold);
    font-size: clamp(3.5rem, 10vw, 6rem); line-height:1; margin-bottom: 24px;
  }
  h1{
    font-family:'Playfair Display', serif; font-weight:600; font-size: clamp(1.5rem, 3vw, 2.2rem);
    margin-bottom: 18px;
  }
  p{ font-size: 0.98rem; line-height:1.7; color: rgba(255,255,255,0.68); margin-bottom: 36px; }
  a.btn{
    display:inline-flex; align-items:center; gap:10px;
    background: var(--gold); color: var(--black);
    padding: 17px 34px; font-size: 0.85rem; font-weight:600;
    letter-spacing: 0.06em; text-transform: uppercase; text-decoration:none;
    border: 1px solid var(--gold);
    transition: background .3s ease, color .3s ease;
  }
  a.btn:hover{ background:transparent; color: var(--gold); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Essa página não existe (ou já foi remontada em outro lugar).</h1>
    <p>O link que você seguiu pode estar desatualizado. Volte para a página inicial da VRB Eventos & Produções para continuar navegando.</p>
    <a class="btn" href="/">Voltar para o início</a>
  </div>
</body>
</html>
